<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">quangtrinh25 GitHub profile header</title>
  <desc id="desc">Applied AI, 3D Vision, Clinical ML, and Forecasting</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a29"/>
      <stop offset="1" stop-color="#0d2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b949e" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <ellipse cx="225" cy="150" rx="260" ry="230" fill="url(#glow)"/>
  <ellipse cx="1055" cy="155" rx="240" ry="210" fill="url(#glow)" opacity=".55"/>

  <!-- Left: a sparse graph suggesting camera geometry and learned structure. -->
  <g fill="none" stroke="#58a6ff" stroke-opacity=".46" stroke-width="1.4">
    <path d="M45 220L112 168L181 210L236 128L302 174L350 88"/>
    <path d="M112 168L160 91L236 128L281 62"/>
    <path d="M181 210L302 174L333 236"/>
    <path d="M45 220L160 91L281 62L350 88" stroke-opacity=".2"/>
  </g>
  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2" filter="url(#softGlow)">
    <circle cx="45" cy="220" r="5"/><circle cx="112" cy="168" r="5"/>
    <circle cx="160" cy="91" r="5"/><circle cx="181" cy="210" r="5"/>
    <circle cx="236" cy="128" r="6"/><circle cx="281" cy="62" r="5"/>
    <circle cx="302" cy="174" r="5"/><circle cx="333" cy="236" r="5"/>
    <circle cx="350" cy="88" r="5"/>
  </g>
  <g fill="#2ea043" opacity=".9">
    <circle cx="112" cy="168" r="2.5"/><circle cx="236" cy="128" r="3"/>
    <circle cx="302" cy="174" r="2.5"/>
  </g>

  <!-- Right: layered signals for temporal modelling and forecasting. -->
  <g fill="none" stroke-linecap="round">
    <path d="M850 190C900 190 913 88 964 88S1026 218 1081 218s61-84 93-84" stroke="#58a6ff" stroke-width="2.2" stroke-opacity=".65"/>
    <path d="M850 214C899 214 920 147 963 147s62 57 106 57 71-119 105-119" stroke="#2ea043" stroke-width="2.2" stroke-opacity=".65"/>
    <path d="M850 238H1174" stroke="url(#accent)" stroke-width="1" stroke-opacity=".3" stroke-dasharray="5 8"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="964" cy="88" r="4"/><circle cx="1081" cy="218" r="4"/>
  </g>
  <g fill="#2ea043">
    <circle cx="963" cy="147" r="4"/><circle cx="1069" cy="204" r="4"/>
  </g>

  <g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="127" fill="#f0f6fc" font-size="48" font-weight="750" letter-spacing="1">Quang Dinh-Trinh</text>
    <rect x="432" y="151" width="336" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="600" y="190" fill="#c9d1d9" font-size="18" font-weight="500" letter-spacing="2.2">APPLIED AI · 3D VISION · CLINICAL ML</text>
    <text x="600" y="222" fill="#8b949e" font-size="15" letter-spacing="1.5">FORECASTING · REPRODUCIBLE RESEARCH</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="21.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
